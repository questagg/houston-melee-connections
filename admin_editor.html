<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Houston Melee Connections Admin</title>
<style>
:root{--bg:#0b0e14;--card:rgba(27,31,41,.86);--text:#f6f7fb;--muted:#b8bdc9;--border:rgba(255,255,255,.13);--accent:#e64f5d;--accent2:#ff7a85;--shadow:0 16px 40px rgba(0,0,0,.3)}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 20% 0%,rgba(230,79,93,.18),transparent 35%),linear-gradient(135deg,#0b0e14,#171c26 55%,#10131a);color:var(--text);min-height:100vh}.wrap{max-width:980px;margin:0 auto;padding:28px 18px 50px}header{text-align:center;margin-bottom:20px}h1{margin:0;font-size:clamp(28px,4vw,46px)}.subtitle{color:var(--muted);margin-top:8px}.login,.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}.login{max-width:430px;margin:40px auto}.tabbar,.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}.tab,button{border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);padding:11px 16px;border-radius:999px;font-weight:900;cursor:pointer}.tab.active,button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:white}.hidden{display:none!important}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.row{grid-template-columns:1fr}}label{display:block;font-weight:900;margin:10px 0 6px}input,textarea,select{width:100%;border:1px solid var(--border);border-radius:12px;padding:11px 12px;background:rgba(255,255,255,.09);color:var(--text);font-weight:700}textarea{min-height:80px;resize:vertical}.group-card{border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:12px;background:rgba(255,255,255,.04)}.words{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:720px){.words{grid-template-columns:1fr 1fr}}.note{color:var(--muted);font-size:14px;line-height:1.45;margin-top:10px}.error{color:#ff9aa3;font-weight:900}.ok{color:#8bd17c;font-weight:900}a{color:#ffb0b8}</style>
</head>
<body>
<div class="wrap">
<header><h1>Houston Melee Connections Admin</h1><div class="subtitle">Edit Connections and Guess Your Clip, then export puzzle.json.</div></header>
<section id="login" class="login"><h2>Admin Login</h2><label>Username</label><input id="user" autocomplete="username"><label>Password</label><input id="pass" type="password" autocomplete="current-password"><div class="actions"><button class="primary" id="loginBtn">Log in</button></div><div id="loginMsg" class="error"></div></section>
<div id="app" class="hidden">
<nav class="tabbar"><button class="tab active" id="connectionsTab" type="button">Connections</button><button class="tab" id="guessTab" type="button">Guess Your Clip</button></nav>
<main id="connectionsView">
<section class="card"><h2>Puzzle Info</h2><div class="row"><div><label>Title</label><input id="title"></div><div><label>Date shown on site</label><input id="date"></div></div><label>Fun fact of the week</label><textarea id="funFact"></textarea></section>
<section class="card"><h2>Connections Groups</h2><div id="groups"></div></section>
</main>
<main id="guessView" class="hidden">
<section class="card"><h2>Guess Your Clip</h2><label><input id="guessEnabled" type="checkbox" style="width:auto;margin-right:8px"> Enable Guess Your Clip tab on public site</label><div class="row"><div><label>Guess title</label><input id="guessTitle" placeholder="Guess Your Clip"></div><div><label>Video file path</label><input id="videoSrc" placeholder="guess-clips/game01.mp4"></div></div><label>Prompt</label><textarea id="guessPrompt" placeholder="Watch the first 30 seconds. Who is playing?"></textarea><div class="row"><div><label>Which port/player are they guessing?</label><select id="guessPort"><option>Player 1</option><option>Player 2</option></select></div><div><label>Text shown under video</label><input id="guessDescription" placeholder="Optional hint text"></div></div><div class="row"><div><label>Correct answer</label><input id="answer" list="playersList" placeholder="Search player tag"></div><div><label>Accepted alternate answers</label><input id="acceptedAnswers" placeholder="comma-separated aliases"></div></div><datalist id="playersList"></datalist><div class="note">Upload your MP4 to <b>guess-clips/</b>, then use a path like <b>guess-clips/game01.mp4</b>.</div></section>
</main>
<section class="card"><h2>Import / Export</h2><div class="actions"><button id="newBlank">New Blank Puzzle</button><label class="tab" for="importFile">Import Puzzle File</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"><button class="primary" id="exportBtn">Export Puzzle File</button></div><div id="status" class="note"></div></section>
</div>
</div>
<script>
const ADMIN_USER='questa',ADMIN_PASS='steinbreezysfeet';
const PLAYER_DATA=[{"rank":1,"name":"Cilan","points":7468,"characters":"Fox"},{"rank":2,"name":"warme","points":7242,"characters":"Falco"},{"rank":3,"name":"Salt","points":7227,"characters":"Captain Falcon - Falco - Fox"},{"rank":4,"name":"AlyJ","points":7028,"characters":"Falco"},{"rank":5,"name":"Ismon","points":7003,"characters":"Peach"},{"rank":6,"name":"Air","points":6999,"characters":"Marth"},{"rank":7,"name":"Shadow_PR","points":6908,"characters":"Peach"},{"rank":8,"name":"Questa","points":6399,"characters":"Peach"},{"rank":9,"name":"Chill","points":6275,"characters":"Falco"},{"rank":10,"name":"Haunter","points":6259,"characters":""},{"rank":11,"name":"Antislycer","points":6188,"characters":""},{"rank":12,"name":"DJC-Bass","points":6171,"characters":""},{"rank":13,"name":"Chikin","points":5751,"characters":""},{"rank":14,"name":"Yuse","points":5447,"characters":"Peach"},{"rank":15,"name":"Castbros","points":5432,"characters":""},{"rank":16,"name":"Glo","points":5299,"characters":"Marth"},{"rank":17,"name":"CHBE Boi","points":5142,"characters":""},{"rank":18,"name":"DroskiDro","points":5052,"characters":"Falco"},{"rank":19,"name":"Touhni","points":5005,"characters":"Marth"},{"rank":20,"name":"DrCondor","points":5002,"characters":"Sheik"},{"rank":21,"name":"Lumbre","points":4929,"characters":"Luigi"},{"rank":22,"name":"Kxrma","points":4860,"characters":""},{"rank":23,"name":"Intravisual","points":4835,"characters":""},{"rank":24,"name":"Potato","points":4789,"characters":"Sheik"},{"rank":25,"name":"MEN","points":4781,"characters":"Donkey Kong - Ganondorf"},{"rank":26,"name":"Pox","points":4767,"characters":""},{"rank":27,"name":"Bryce","points":4760,"characters":"Marth"},{"rank":28,"name":"minymidge","points":4730,"characters":"Captain Falcon - Falco - Fox"},{"rank":29,"name":"Fhil","points":4715,"characters":""},{"rank":30,"name":"Mariposa","points":4568,"characters":""},{"rank":31,"name":"Cade","points":4414,"characters":"Captain Falcon"},{"rank":32,"name":"Prince Fai","points":4404,"characters":"Fox"},{"rank":33,"name":"Pi2z","points":4285,"characters":"Falco"},{"rank":34,"name":"Terms","points":4228,"characters":"Falco"},{"rank":35,"name":"G00se","points":4027,"characters":"Fox"},{"rank":36,"name":"UHA | UchihaScar","points":4025,"characters":""},{"rank":37,"name":"Rascal","points":4017,"characters":""},{"rank":38,"name":"bitz","points":3897,"characters":""},{"rank":39,"name":"Jack","points":3887,"characters":""},{"rank":40,"name":"Steinbreezy","points":3827,"characters":"Sheik"},{"rank":41,"name":"Nero","points":3793,"characters":""},{"rank":42,"name":"SirTaco","points":3783,"characters":""},{"rank":43,"name":"STaCk MoNEy Ian","points":3748,"characters":"Fox"},{"rank":44,"name":"Chapapa","points":3745,"characters":"Captain Falcon"},{"rank":45,"name":"Hyruler","points":3724,"characters":""},{"rank":46,"name":"g3","points":3663,"characters":"Captain Falcon"},{"rank":47,"name":"IR","points":3449,"characters":""},{"rank":48,"name":"FLOW | Demon","points":3357,"characters":""},{"rank":49,"name":"Cal","points":3352,"characters":""},{"rank":50,"name":"Techdeck","points":3348,"characters":"Captain Falcon"},{"rank":51,"name":"SLEE | Worb","points":3329,"characters":"Luigi"},{"rank":52,"name":"Diddy Booty Jackson","points":3326,"characters":""},{"rank":53,"name":"TVBen","points":3295,"characters":"Marth"},{"rank":54,"name":"Mega","points":3224,"characters":"Fox"},{"rank":55,"name":"Twiffler","points":3164,"characters":""},{"rank":56,"name":"KV","points":3123,"characters":""},{"rank":57,"name":"Miles","points":3080,"characters":"Falco"},{"rank":58,"name":"gamer","points":2980,"characters":""},{"rank":59,"name":"JF","points":2978,"characters":""},{"rank":60,"name":"BonBon BeanBean","points":2920,"characters":""},{"rank":61,"name":"X...","points":2902,"characters":""},{"rank":62,"name":"irrelevant","points":2803,"characters":""},{"rank":63,"name":"ke$ha nightcore","points":2781,"characters":""},{"rank":64,"name":"Watcher","points":2773,"characters":""},{"rank":65,"name":"zim","points":2656,"characters":"Ice Climbers"},{"rank":66,"name":"SJW | Rukyy","points":2589,"characters":""},{"rank":67,"name":"Jarby","points":2449,"characters":""},{"rank":68,"name":"PL","points":2391,"characters":"Sheik"},{"rank":69,"name":"PNG | nano","points":2341,"characters":"Marth"},{"rank":70,"name":"CASH","points":2326,"characters":"Falco"},{"rank":71,"name":"vapee","points":2175,"characters":""},{"rank":72,"name":"RFO | Shelo","points":2157,"characters":"Marth"},{"rank":73,"name":"Ramz","points":2136,"characters":"Falco"},{"rank":74,"name":"juss.","points":2130,"characters":""},{"rank":75,"name":"ActualMonday","points":2086,"characters":""},{"rank":76,"name":"TRG | Squishyy","points":2042,"characters":""},{"rank":77,"name":"LuigiAC","points":2041,"characters":""},{"rank":78,"name":"Rambisco","points":2017,"characters":""},{"rank":79,"name":"brentos","points":1853,"characters":""},{"rank":80,"name":"Bobby Flay","points":1843,"characters":"Falco"},{"rank":81,"name":"Gum","points":1762,"characters":""},{"rank":82,"name":"dLN","points":1691,"characters":"Falco"},{"rank":83,"name":"Wertget","points":1670,"characters":"Captain Falcon - Falco"},{"rank":84,"name":"A(YK) | Collwizard","points":1647,"characters":""},{"rank":85,"name":"Bombchu","points":1639,"characters":""},{"rank":86,"name":"BUH","points":1579,"characters":"Bowser"},{"rank":87,"name":"Nasty","points":1522,"characters":""},{"rank":88,"name":"lzrd","points":1442,"characters":"Pikachu"},{"rank":89,"name":"Nomad","points":1329,"characters":""},{"rank":90,"name":"raultheghoul","points":1235,"characters":"Falco"},{"rank":91,"name":"Schmoinguss","points":1129,"characters":""},{"rank":92,"name":"JNSA4","points":1116,"characters":""},{"rank":93,"name":"meeebis","points":1034,"characters":""},{"rank":94,"name":"Biotroid","points":940,"characters":"Samus"},{"rank":95,"name":"RA2S | Raulata2stair","points":785,"characters":""},{"rank":96,"name":"Leo.","points":254, const PLAYER_LIST=PLAYER_DATA.map(p=>p.name);
const blank={title:'Houston Melee Connections',date:'This Week',funFact:'',players:PLAYER_LIST,playerData:PLAYER_DATA,groups:[{name:'',difficulty:'yellow',words:['','','','']},{name:'',difficulty:'green',words:['','','','']},{name:'',difficulty:'blue',words:['','','','']},{name:'',difficulty:'purple',words:['','','','']}],guessGame:{enabled:true,title:'Guess Your Clip',prompt:'Watch the first 30 seconds. Who is playing?',videoSrc:'guess-clips/game01.mp4',guessPort:'Player 1',stockIcon:'',guessDescription:'',answer:'',acceptedAnswers:[]}};
let puzzle=structuredClone(blank);const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderGroups(){groups.innerHTML=puzzle.groups.map((g,i)=>`<div class="group-card"><h3>Group ${i+1}</h3><div class="row"><div><label>Category name</label><input data-g="${i}" data-f="name" value="${esc(g.name)}"></div><div><label>Difficulty</label><select data-g="${i}" data-f="difficulty"><option ${g.difficulty==='yellow'?'selected':''}>yellow</option><option ${g.difficulty==='green'?'selected':''}>green</option><option ${g.difficulty==='blue'?'selected':''}>blue</option><option ${g.difficulty==='purple'?'selected':''}>purple</option></select></div></div><label>Words</label><div class="words">${g.words.map((w,j)=>`<input data-g="${i}" data-w="${j}" value="${esc(w)}" placeholder="Word ${j+1}">`).join('')}</div></div>`).join('')}
function renderPlayers(){playersList.innerHTML=(puzzle.players||PLAYER_LIST).map(p=>`<option value="${esc(p)}"></option>`).join('')}
function render(){title.value=puzzle.title||'';date.value=puzzle.date||'';funFact.value=puzzle.funFact||'';renderGroups();const g=puzzle.guessGame||blank.guessGame;guessEnabled.checked=!!g.enabled;guessTitle.value=g.title||'';videoSrc.value=g.videoSrc||'';guessPrompt.value=g.prompt||'';guessPort.value=g.guessPort||'Player 1';guessDescription.value=g.guessDescription||'';answer.value=g.answer||'';acceptedAnswers.value=(g.acceptedAnswers||[]).join(', ');renderPlayers()}
function sync(){puzzle.title=title.value;puzzle.date=date.value;puzzle.funFact=funFact.value;puzzle.players=PLAYER_LIST;puzzle.playerData=PLAYER_DATA;puzzle.groups=[...document.querySelectorAll('.group-card')].map((card,i)=>({name:card.querySelector(`[data-g="${i}"][data-f="name"]`).value,difficulty:card.querySelector(`[data-g="${i}"][data-f="difficulty"]`).value,words:[...card.querySelectorAll(`[data-g="${i}"][data-w]`)].map(x=>x.value.trim().toUpperCase())}));puzzle.guessGame={enabled:guessEnabled.checked,title:guessTitle.value||'Guess Your Clip',prompt:guessPrompt.value||'Watch the first 30 seconds. Who is playing?',videoSrc:videoSrc.value,guessPort:guessPort.value,stockIcon:'',guessDescription:guessDescription.value,answer:answer.value,acceptedAnswers:acceptedAnswers.value.split(',').map(s=>s.trim()).filter(Boolean)}}
function showTab(name){const guess=name==='guess';connectionsView.classList.toggle('hidden',guess);guessView.classList.toggle('hidden',!guess);connectionsTab.classList.toggle('active',!guess);guessTab.classList.toggle('active',guess)}
loginBtn.onclick=()=>{if(user.value===ADMIN_USER&&pass.value===ADMIN_PASS){login.classList.add('hidden');app.classList.remove('hidden');render()}else loginMsg.textContent='Wrong username or password.'};connectionsTab.onclick=()=>showTab('connections');guessTab.onclick=()=>showTab('guess');
newBlank.onclick=()=>{if(confirm('Start a new blank puzzle?')){puzzle=structuredClone(blank);render()}};
importFile.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{puzzle=JSON.parse(r.result);puzzle.players=PLAYER_LIST;puzzle.playerData=PLAYER_DATA;puzzle.guessGame=puzzle.guessGame||structuredClone(blank.guessGame);render();status.textContent='Imported puzzle.json.'}catch{status.textContent='Could not read JSON.'}};r.readAsText(f)};
exportBtn.onclick=()=>{sync();const blob=new Blob([JSON.stringify(puzzle,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='puzzle.json';a.click();URL.revokeObjectURL(a.href);status.textContent='Exported puzzle.json. Upload it with index.html and your guess-clips folder.'};
</script>
</body>
</html>
