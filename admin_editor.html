<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Houston Melee Connections Admin</title>
<style>
:root{--bg:#0b0e14;--card:rgba(27,31,41,.86);--text:#f6f7fb;--muted:#b8bdc9;--border:rgba(255,255,255,.13);--accent:#e64f5d;--accent2:#ff7a85;--shadow:0 16px 40px rgba(0,0,0,.3)}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 20% 0%,rgba(230,79,93,.18),transparent 35%),linear-gradient(135deg,#0b0e14,#171c26 55%,#10131a);color:var(--text);min-height:100vh}.wrap{max-width:980px;margin:0 auto;padding:28px 18px 50px}header{text-align:center;margin-bottom:20px}h1{margin:0;font-size:clamp(28px,4vw,46px)}.subtitle{color:var(--muted);margin-top:8px}.login,.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}.login{max-width:430px;margin:40px auto}.tabbar,.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}.tab,button{border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);padding:11px 16px;border-radius:999px;font-weight:900;cursor:pointer}.tab.active,button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:white}.hidden{display:none!important}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.row{grid-template-columns:1fr}}label{display:block;font-weight:900;margin:10px 0 6px}input,textarea,select{width:100%;border:1px solid var(--border);border-radius:12px;padding:11px 12px;background:rgba(255,255,255,.09);color:var(--text);font-weight:700}textarea{min-height:80px;resize:vertical}.group-card{border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:12px;background:rgba(255,255,255,.04)}.words{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:720px){.words{grid-template-columns:1fr 1fr}}.note{color:var(--muted);font-size:14px;line-height:1.45;margin-top:10px}.error{color:#ff9aa3;font-weight:900}.ok{color:#8bd17c;font-weight:900}a{color:#ffb0b8}</style>
</head>
<body>
<div class="wrap">
<header><h1>Houston Melee Connections Admin</h1><div class="subtitle">Edit Connections and Guess Your Clip, then export puzzle.json.</div></header>
<section id="login" class="login"><h2>Admin Login</h2><label>Username</label><input id="user" autocomplete="username"><label>Password</label><input id="pass" type="password" autocomplete="current-password"><div class="actions"><button class="primary" id="loginBtn">Log in</button></div><div id="loginMsg" class="error"></div></section>
<div id="app" class="hidden">
<nav class="tabbar"><button class="tab active" id="connectionsTab" type="button">Connections</button><button class="tab" id="guessTab" type="button">Guess Your Clip</button></nav>
<main id="connectionsView">
<section class="card"><h2>Puzzle Info</h2><div class="row"><div><label>Title</label><input id="title"></div><div><label>Date shown on site</label><input id="date"></div></div><label>Fun fact of the week</label><textarea id="funFact"></textarea></section>
<section class="card"><h2>Connections Groups</h2><div id="groups"></div></section>
</main>
<main id="guessView" class="hidden">
<section class="card"><h2>Guess Your Clip</h2><label><input id="guessEnabled" type="checkbox" style="width:auto;margin-right:8px"> Enable Guess Your Clip tab on public site</label><div class="row"><div><label>Guess title</label><input id="guessTitle" placeholder="Guess Your Clip"></div><div><label>Video file path</label><input id="videoSrc" placeholder="guess-clips/game01.mp4"></div></div><label>Prompt</label><textarea id="guessPrompt" placeholder="Watch the first 30 seconds. Who is playing?"></textarea><div class="row"><div><label>Which port/player are they guessing?</label><select id="guessPort"><option>Player 1</option><option>Player 2</option></select></div><div><label>Text shown under video</label><input id="guessDescription" placeholder="Optional hint text"></div></div><div class="row"><div><label>Correct answer</label><input id="answer" list="playersList" placeholder="Search player tag"></div><div><label>Accepted alternate answers</label><input id="acceptedAnswers" placeholder="comma-separated aliases"></div></div><datalist id="playersList"></datalist><div class="note">Upload your MP4 to <b>guess-clips/</b>, then use a path like <b>guess-clips/game01.mp4</b>.</div></section>
</main>
<section class="card"><h2>Import / Export</h2><div class="actions"><button id="newBlank">New Blank Puzzle</button><label class="tab" for="importFile">Import Puzzle File</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"><button class="primary" id="exportBtn">Export Puzzle File</button></div><div id="status" class="note"></div></section>
</div>
</div>
<script>
const ADMIN_USER='questa',ADMIN_PASS='steinbreezysfeet';
const PLAYER_LIST=["Cilan","warme","Salt","AlyJ","Ismon","Air","Shadow_PR","Questa","Chill","Haunter","Antislycer","DJC-Bass","Chikin","Yuse","Castbros","Glo","CHBE Boi","DroskiDro","Touhni","DrCondor","Lumbre","Kxrma","Intravisual","Potato","MEN","Pox","Bryce","minymidge","Fhil","Mariposa","Cade","Prince Fai","Pi2z","Terms","G00se","UHA | UchihaScar","Rascal","bitz","Jack","Steinbreezy","Nero","SirTaco","STaCk MoNEy Ian","Chapapa","Hyruler","g3","IR","FLOW | Demon","Cal","Techdeck","SLEE | Worb","Diddy Booty Jackson","TVBen","Mega","Twiffler","KV","Miles","gamer","JF","BonBon BeanBean","X...","irrelevant","ke$ha nightcore","Watcher","zim","SJW | Rukyy","Jarby","PL","PNG | nano","CASH","vapee","RFO | Shelo","Ramz","juss.","ActualMonday","TRG | Squishyy","LuigiAC","Rambisco","brentos","Bobby Flay","Gum","dLN","Wertget","A(YK) | Collwizard","Bombchu","BUH","Nasty","lzrd","Nomad","raultheghoul","Schmoinguss","JNSA4","meeebis","Biotroid","RA2S | Raulata2stair","Leo.","Pumpkin Hill","Gemz","zombiespartan73","Axel","SDH","Voridin","TeeCee","snowcrow","All Aboard","Chowdari","D_I_RT","raul@a2stair","kipper","kotaro","RosettaxCloud","MDL | NapTime!?","weejis","Lukas","snail","ashton","xxIAMHARDHELPxx"];
const blank={title:'Houston Melee Connections',date:'This Week',funFact:'',players:PLAYER_LIST,groups:[{name:'',difficulty:'yellow',words:['','','','']},{name:'',difficulty:'green',words:['','','','']},{name:'',difficulty:'blue',words:['','','','']},{name:'',difficulty:'purple',words:['','','','']}],guessGame:{enabled:true,title:'Guess Your Clip',prompt:'Watch the first 30 seconds. Who is playing?',videoSrc:'guess-clips/game01.mp4',guessPort:'Player 1',stockIcon:'',guessDescription:'',answer:'',acceptedAnswers:[]}};
let puzzle=structuredClone(blank);const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderGroups(){groups.innerHTML=puzzle.groups.map((g,i)=>`<div class="group-card"><h3>Group ${i+1}</h3><div class="row"><div><label>Category name</label><input data-g="${i}" data-f="name" value="${esc(g.name)}"></div><div><label>Difficulty</label><select data-g="${i}" data-f="difficulty"><option ${g.difficulty==='yellow'?'selected':''}>yellow</option><option ${g.difficulty==='green'?'selected':''}>green</option><option ${g.difficulty==='blue'?'selected':''}>blue</option><option ${g.difficulty==='purple'?'selected':''}>purple</option></select></div></div><label>Words</label><div class="words">${g.words.map((w,j)=>`<input data-g="${i}" data-w="${j}" value="${esc(w)}" placeholder="Word ${j+1}">`).join('')}</div></div>`).join('')}
function renderPlayers(){playersList.innerHTML=(puzzle.players||PLAYER_LIST).map(p=>`<option value="${esc(p)}"></option>`).join('')}
function render(){title.value=puzzle.title||'';date.value=puzzle.date||'';funFact.value=puzzle.funFact||'';renderGroups();const g=puzzle.guessGame||blank.guessGame;guessEnabled.checked=!!g.enabled;guessTitle.value=g.title||'';videoSrc.value=g.videoSrc||'';guessPrompt.value=g.prompt||'';guessPort.value=g.guessPort||'Player 1';guessDescription.value=g.guessDescription||'';answer.value=g.answer||'';acceptedAnswers.value=(g.acceptedAnswers||[]).join(', ');renderPlayers()}
function sync(){puzzle.title=title.value;puzzle.date=date.value;puzzle.funFact=funFact.value;puzzle.players=puzzle.players&&puzzle.players.length?puzzle.players:PLAYER_LIST;puzzle.groups=[...document.querySelectorAll('.group-card')].map((card,i)=>({name:card.querySelector(`[data-g="${i}"][data-f="name"]`).value,difficulty:card.querySelector(`[data-g="${i}"][data-f="difficulty"]`).value,words:[...card.querySelectorAll(`[data-g="${i}"][data-w]`)].map(x=>x.value.trim().toUpperCase())}));puzzle.guessGame={enabled:guessEnabled.checked,title:guessTitle.value||'Guess Your Clip',prompt:guessPrompt.value||'Watch the first 30 seconds. Who is playing?',videoSrc:videoSrc.value,guessPort:guessPort.value,stockIcon:'',guessDescription:guessDescription.value,answer:answer.value,acceptedAnswers:acceptedAnswers.value.split(',').map(s=>s.trim()).filter(Boolean)}}
function showTab(name){const guess=name==='guess';connectionsView.classList.toggle('hidden',guess);guessView.classList.toggle('hidden',!guess);connectionsTab.classList.toggle('active',!guess);guessTab.classList.toggle('active',guess)}
loginBtn.onclick=()=>{if(user.value===ADMIN_USER&&pass.value===ADMIN_PASS){login.classList.add('hidden');app.classList.remove('hidden');render()}else loginMsg.textContent='Wrong username or password.'};connectionsTab.onclick=()=>showTab('connections');guessTab.onclick=()=>showTab('guess');
newBlank.onclick=()=>{if(confirm('Start a new blank puzzle?')){puzzle=structuredClone(blank);render()}};
importFile.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{puzzle=JSON.parse(r.result);puzzle.players=puzzle.players&&puzzle.players.length?puzzle.players:PLAYER_LIST;puzzle.guessGame=puzzle.guessGame||structuredClone(blank.guessGame);render();status.textContent='Imported puzzle.json.'}catch{status.textContent='Could not read JSON.'}};r.readAsText(f)};
exportBtn.onclick=()=>{sync();const blob=new Blob([JSON.stringify(puzzle,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='puzzle.json';a.click();URL.revokeObjectURL(a.href);status.textContent='Exported puzzle.json. Upload it with index.html and your guess-clips folder.'};
</script>
</body>
</html>
